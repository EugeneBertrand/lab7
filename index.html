<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js?v=925efbd"></script>
  </head>
  <body>
    <header>
      <h1>🚴🏼‍♀️ Bikewatching</h1>
      <label class="time-filter" for="time-slider">
        <span>Filter by time:</span>
        <input id="time-slider" type="range" min="-1" max="1439" value="-1" step="1" />
        <span class="time-readout">
          <time id="selected-time" aria-live="polite"></time>
          <em id="any-time">(any time)</em>
        </span>
      </label>
    </header>

    <main>
      <div id="map" aria-label="Boston area bike traffic map"></div>
      <div class="legend" aria-label="Legend for traffic direction">
        <div style="--departure-ratio: 1">
          <span class="legend-sample"></span>
          <span>More departures</span>
        </div>
        <div style="--departure-ratio: 0.5">
          <span class="legend-sample"></span>
          <span>Balanced</span>
        </div>
        <div style="--departure-ratio: 0">
          <span class="legend-sample"></span>
          <span>More arrivals</span>
        </div>
      </div>
    </main>
  </body>
</html>
